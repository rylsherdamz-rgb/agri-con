services:
  - type: web
    name: agri-con-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npx prisma generate
    startCommand: node start.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: agri-con-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENEO_CLIENT_ID
        sync: false
      - key: OPENEO_CLIENT_SECRET
        sync: false
      - key: OPENEO_BASE_URL
        value: "https://openeo.dataspace.copernicus.eu"
      - key: OPENEO_SH_BASE_URL
        value: "https://openeosh.dataspace.copernicus.eu"
      - key: GCP_FARMER_ID_BUCKET
        sync: false
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: agri-con-db
    databaseName: agri_con
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []